services:
  bubba:
    build: .
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      DATABASE_URL: "file:/app/packages/db/prisma/dev.db"
      NEXTAUTH_SECRET: "cambia-este-secreto-por-uno-seguro"
      NEXTAUTH_URL: "http://localhost:3001"
    volumes:
      - bubba-data:/app/packages/db/prisma
    restart: unless-stopped

volumes:
  bubba-data:
